name: Build ARM64 Image (Oracle A1)

# Non-blocking companion to deploy-to-aws.yml. The ECS/Fargate deploy path is
# untouched and still builds amd64-only. This workflow builds the linux/arm64
# image for the OCI Ampere A1 box on GitHub's hosted ARM runner
# (`ubuntu-24.04-arm`, free for public repos): native ARM, no QEMU.
#
# Why not on the A1 box itself (#2590, moved off 2026-11-23): the self-hosted
# build took 68 min and competed with the box's own workload for its 2 OCPU,
# and a self-hosted runner on a public repo is an attack surface. Builds run
# on GitHub; the box only pulls the finished image.
#
# Why separate instead of a multi-arch deploy build (founder review on #2585):
# a QEMU arm64 leg measured 49+ min and would have paid that on EVERY deploy.
# Here the arm64 build can never delay, block, or break the ECS deploy.
#
# Tags: `latest-arm64` + `sha-<hash>-arm64`, a separate namespace from the
# amd64 tags the deploy pushes. The A1 box pulls `latest-arm64` from GHCR.
# Nothing restarts the box's stack yet: pull + recreate by hand until the
# compose file lives in this repo.

on:
  push:
    branches: [main]
    # Anything that can change the image. Wider than docker-build-check.yml on
    # purpose: that check only proves the Dockerfile still builds, while the
    # mirror has to track the code prod runs.
    paths:
      - 'apps/backend/**'
      - 'packages/**'
      - '.dockerignore'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - '.github/workflows/build-arm64.yml'
  workflow_dispatch:

concurrency:
  # One arm64 build at a time; last push wins.
  group: build-arm64
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-arm64:
    name: Build & push arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image vars (lowercase)
        id: image-vars
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          {
            echo "image=ghcr.io/${REPO_LC}"
            echo "tag=sha-${{ github.sha }}-arm64"
          } >> "$GITHUB_OUTPUT"

      # Build args are baked into the Vite admin bundle at build time. Public
      # URLs, not secrets — same vars as deploy-to-aws.yml. The GitHub Actions
      # cache keeps the dependency layers between runs (scope keeps it apart
      # from any other workflow's cache).
      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            MEDUSA_BACKEND_URL=${{ vars.MEDUSA_BACKEND_URL }}
            VITE_MEDUSA_BACKEND_URL=${{ vars.MEDUSA_BACKEND_URL }}
            VITE_MEDIA_GALLERY_BASE_URL=${{ vars.VITE_MEDIA_GALLERY_BASE_URL }}
            VITE_STOREFRONT_URL=${{ vars.VITE_STOREFRONT_URL }}
          tags: |
            ${{ steps.image-vars.outputs.image }}:latest-arm64
            ${{ steps.image-vars.outputs.image }}:${{ steps.image-vars.outputs.tag }}
          cache-from: type=gha,scope=build-arm64
          cache-to: type=gha,scope=build-arm64,mode=max

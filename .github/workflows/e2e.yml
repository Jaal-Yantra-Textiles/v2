name: E2E (admin UI)

# Browser-level verification of admin UI extensions (Playwright, headless
# Chromium). Boots a real `medusa develop` server against a fresh Postgres,
# seeds demo commerce infra + a fixture admin/order, then drives the admin.
# Kept as its own workflow (separate from Test and Release) so the heavier
# browser run can be gated to the paths that actually affect admin UI.

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/backend/src/admin/**'
      - 'apps/backend/src/scripts/seed.ts'
      - 'e2e/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/backend/src/admin/**'
      - 'apps/backend/src/scripts/seed.ts'
      - 'e2e/**'
      - '.github/workflows/e2e.yml'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      # No REDIS_URL → the backend falls back to an in-memory (fake) redis, the
      # same path the seed uses locally. A single-worker e2e needs no real bus.
      DATABASE_URL: postgresql://runner@localhost:5432/postgres
      POSTGRES_USER: runner
      POSTGRES_PASSWORD: runner
      # The CRM is a Hyperbee node, not Postgres. Without this the module is
      # not registered at all and the CRM screens render an empty state — which
      # a spec would pass against. The embedded store is single-writer and
      # dev-only, which is exactly what a single-worker e2e is.
      CRM_HYPERBEE: "true"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Workspace plugins ship built output under .medusa/; the backend can't
      # boot until they're built (mirrors the Test and Release workflow).
      - name: Build workspace plugins
        run: pnpm --filter "@jytextiles/medusa-plugin-etsy-sync" build

      - name: Setup database user
        run: |
          psql -h localhost -U postgres -d postgres -c "CREATE USER runner SUPERUSER CREATEDB CREATEROLE;"
          psql -h localhost -U postgres -d postgres -c "GRANT ALL PRIVILEGES ON DATABASE postgres TO runner;"

      - name: Create backend env file
        run: |
          # Written to BOTH .env and .env.test so every entrypoint finds config
          # whether it resolves NODE_ENV=test (medusa exec / integration) or
          # development (medusa develop).
          cat << 'EOF' > apps/backend/.env.test
          DATABASE_TYPE=postgres
          DATABASE_URL=postgresql://runner@localhost:5432/postgres
          JWT_SECRET=secret
          COOKIE_SECRET=secret
          ADMIN_CORS=http://localhost:9000
          STORE_CORS=http://localhost:9000
          # The partner UI runs on :5173 and calls this backend cross-origin.
          # PARTNER_CORS is what createCorsPartnerMiddleware reads first;
          # AUTH_CORS has to admit :5173 too or partner LOGIN is blocked before
          # any /partners route is reached.
          AUTH_CORS=http://localhost:9000,http://localhost:5173
          PARTNER_CORS=http://localhost:5173
          NODE_ENV=test
          ENCRYPTION_KEY=bPH59JuZDRQULLeDD62+NiwqwcChpOLN/j7aqu3A+Hw=
          EOF
          cp apps/backend/.env.test apps/backend/.env

      - name: Run migrations
        working-directory: apps/backend
        run: pnpm exec medusa db:migrate --execute-safe-links

      # Demo commerce infra (region / sales channel / manual shipping option /
      # products) the e2e order fixture depends on. e2e:seed throws a clear
      # error if this hasn't run first.
      - name: Seed demo commerce data
        working-directory: apps/backend
        run: pnpm run seed

      - name: Install Playwright browser
        working-directory: apps/backend
        run: pnpm exec playwright install --with-deps chromium

      # e2e:seed (fixture admin + order) then e2e:test (Playwright boots
      # `medusa develop` on :9000 and drives the admin headlessly).
      # `apps/partner-ui` has no e2e coverage on CI at all: the Playwright
      # config excludes @partnerui because nothing served :5173. So partner
      # specs were written, committed, and never executed — the #1571 spec
      # included, on the very PR that added it.
      #
      # Booting the dev server here is what makes those specs real. Vite's
      # default VITE_MEDUSA_BACKEND_URL is already http://localhost:9000, which
      # is where Playwright's webServer puts the backend.
      # 🔴 apps/partner-ui/.env is GITIGNORED, so it does not exist on CI — and
      # vite.config.mts defaults VITE_MEDUSA_ADMIN_AUTH_TYPE to "session" when
      # it is absent. `client.ts` reads that as `__AUTH_TYPE__ ?? "jwt"`, and
      # `??` does NOT fire on the string "session", so the SDK stops sending
      # `Authorization: Bearer …` and relies on cross-origin cookies instead.
      #
      # The failure that produces is genuinely nasty to read: login SUCCEEDS and
      # the token lands in localStorage (the storage key falls back to the right
      # value via `||`), so the specs sail through beforeEach — then every data
      # call 401s and each screen renders its empty state. Two independent specs
      # failed as "element not found", pointing at the assertions rather than at
      # auth.
      - name: Create partner UI env file
        run: |
          cat << 'EOF' > apps/partner-ui/.env
          VITE_MEDUSA_ADMIN_AUTH_TYPE=jwt
          VITE_MEDUSA_ADMIN_JWT_TOKEN_STORAGE_KEY=partner_ui_auth_token
          VITE_MEDUSA_BACKEND_URL=http://localhost:9000
          EOF

      - name: Start partner UI
        run: pnpm --filter @jyt/partner-ui dev --host 127.0.0.1 --port 5173 &

      - name: Wait for partner UI
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5173 > /dev/null; then
              echo "partner UI up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::partner UI did not come up on :5173 within 60s"
          exit 1

      - name: Run e2e
        working-directory: apps/backend
        # PARTNER_UI opts the @partnerui specs back in — see playwright.config.ts.
        env:
          PARTNER_UI: "1"
        run: pnpm run e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
